<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laško Malt — Ananas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --orange: #ff8c00;
    --orange-deep: #cc6600;
    --orange-light: #ffb347;
    --gold: #ffce47;
    --cream: #fff5e6;
    --stone: #ffe0b2;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  html,body{
    height:100%;
    background:var(--orange-deep);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  .wrap{
    display:grid;
    grid-template-columns: 1.1fr 0.9fr;
    flex:1;
    position:relative;
  }

  .left{
    background:
      radial-gradient(circle at 15% 20%, rgba(255, 179, 71, 0.4), transparent 50%),
      linear-gradient(180deg, var(--orange) 0%, var(--orange-deep) 100%);
    padding: 8vh 6vw;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
    border-right: 1px solid rgba(255,255,255,0.18);
    animation: fadeIn 1s ease-out;
  }

  .kicker{
    font-size:0.8rem;
    letter-spacing:0.12em;
    text-transform: uppercase;
    color:var(--stone);
    margin-bottom:1.2rem;
    font-weight:600;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(2.8rem, 6vw, 5.2rem);
    line-height:1.02;
    color:var(--cream);
    letter-spacing:-0.01em;
  }

  h1 span{
    display:block;
    color:var(--gold);
    font-style:italic;
    font-weight:400;
  }

  .role{
    margin-top:1.6rem;
    font-size:1.05rem;
    color:var(--stone);
    max-width:38ch;
    line-height:1.6;
  }

  .divider{
    width:46px;
    height:2px;
    background:var(--gold);
    margin:2.2rem 0;
  }

  .contact{
    display:flex;
    gap:2.2rem;
    flex-wrap:wrap;
    align-items: center;
  }

  .contact a{
    color:var(--cream);
    text-decoration:none;
    font-size:0.92rem;
    border-bottom:1px solid rgba(255,245,230,0.35);
    padding-bottom:3px;
    transition: all 0.3s ease;
  }

  .contact a:hover{
    color:var(--gold);
    border-color:var(--gold);
    transform: translateY(-2px);
  }

  .right{
    position:relative;
    background:
      radial-gradient(circle at 70% 30%, rgba(255,179,71,0.35), transparent 60%),
      var(--orange-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .right::before{
    content:"";
    position:absolute;
    width:620px;
    height:620px;
    border-radius:50%;
    background:radial-gradient(
      circle,
      rgba(255,206,71,0.2) 0%,
      transparent 70%
    );
    animation: pulseGlow 5s infinite alternate;
  }

  .can-frame{
    position:relative;
    z-index:2;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    height:100%;
    padding:6vh 0 0 0;
  }

  .can-frame img{
    max-height:76vh;
    width:auto;
    filter:drop-shadow(0 40px 60px rgba(0,0,0,0.55));
    transform:translateY(2%);
    animation: floatImage 4s ease-in-out infinite alternate;
  }

  /* Stilno oblikovan nadomestni prikaz, če slike ni mogoče naložiti */
  .image-fallback {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 260px;
    height: 480px;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
    border: 2px dashed rgba(255,206,71,0.4);
    border-radius: 20px;
    text-align: center;
    padding: 2rem;
    color: var(--cream);
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }

  .image-fallback span {
    font-size: 3.5rem;
    margin-bottom: 1rem;
  }

  .image-fallback p {
    font-size: 0.9rem;
    color: var(--stone);
    line-height: 1.4;
  }

  .plinth{
    position:absolute;
    bottom:6vh;
    width:340px;
    height:26px;
    background:radial-gradient(
      ellipse at center,
      rgba(0,0,0,0.45) 0%,
      transparent 72%
    );
    z-index:1;
  }

  footer{
    background:#b85200;
    border-top:1px solid rgba(255,255,255,0.2);
    padding:1.4rem 6vw;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.85rem;
    color:var(--stone);
  }

  footer .mark{
    color:var(--gold);
    letter-spacing:0.04em;
    font-weight: 600;
  }

  .back-btn {
    display: inline-block;
    transition: transform 0.3s ease;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.2);
  }

  .back-btn:hover {
    transform: scale(1.05);
    border-color: var(--gold);
  }

  .back-container {
    padding: 1rem 6vw;
    background: var(--orange-deep);
    display: flex;
    justify-content: flex-start;
  }

  /* Animacije */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes floatImage {
    0% { transform: translateY(2%) rotate(0deg); }
    100% { transform: translateY(-3%) rotate(1.5deg); }
  }

  @keyframes pulseGlow {
    0% { transform: scale(0.95); opacity: 0.7; }
    100% { transform: scale(1.08); opacity: 1; }
  }

  @media (max-width:860px){
    .wrap{
      grid-template-columns:1fr;
    }

    .left{
      padding:7vh 8vw 3vh;
      border-right:none;
    }

    .right{
      min-height:50vh;
      padding-bottom:3vh;
    }

    .can-frame img{
      max-height:45vh;
      animation: none;
    }

    footer{
      flex-direction:column;
      gap:0.5rem;
      text-align:center;
    }
  }
</style>
</head>

<body>

  <div class="wrap">

    <div class="left">
      <div class="kicker">Tropska Osvežitev</div>
      <h1>Laško Malt<span>Ananas</span></h1>
      <p class="role">Popolna kombinacija brezalkoholne osvežitve in eksotičnega okusa ananasa. Ustvarjeno za sproščene trenutke.</p>
      
      <div class="divider"></div>
      
      <div class="contact">
        <a href="https://lasko-trgovina.si/" target="_blank" rel="noopener">Spletna trgovina</a>
        <a href="https://www.lasko.eu/" target="_blank" rel="noopener">Razišči več</a>
      </div>
    </div>

    <div class="right">
      <div class="can-frame">
        <!-- Slika z vgrajenim avtomatskim nadomestnim prikazom, če datoteke ni -->
        <img src="greg.jpg" alt="Laško Malt Ananas" onerror="this.style.display='none'; document.getElementById('fallbackBox').style.display='flex';">
        
        <!-- Nadomestni element, ki se prikaže, če manka slika -->
        <div class="image-fallback" id="fallbackBox">
          <span>🍍</span>
          <p><strong>Laško Malt Ananas</strong><br><small style="opacity: 0.8; font-size: 0.8rem;">(Dodaj sliko 'Laško-malt-ananas.jpg' v mapo)</small></p>
        </div>
      </div>
      <div class="plinth"></div>
    </div>

  </div>

  <div class="back-container">
    <a href="index.html" class="back-btn" title="Nazaj">
      <img src="go-back-WR78WH.jpg" width="90" alt="Nazaj" style="display:block;" onerror="this.style.display='none';">
    </a>
  </div>

  <footer>
    <span>Laško Malt &copy; 2026</span>
    <span class="mark">na zdravje 🍍</span>
  </footer>

</body>
</html>
